[package]
name = "locken"
version = "2.0.8"
description = "Locken, the focus app, for Windows"
edition = "2021"
publish = false

[lib]
name = "locken_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
# System media controls, for "now playing" on the sidebar profile card.
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Storage_Streams"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
