<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="glassicons.css">
<style>html, body, #root { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Regular.ttf'); font-weight: 400; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Medium.ttf'); font-weight: 500; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-SemiBold.ttf'); font-weight: 600; }
@font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'Doto'; src: url('fonts/Doto.ttf'); font-weight: 100 900; }
body { font-family: 'Montserrat', sans-serif; }
#root { display: flex; align-items: flex-start; justify-content: center; }
.rail { padding: 18px 26px 42px; box-sizing: border-box; }
.glass-icon-label { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; }
.glass-icon.is-selected::after { content: ''; position: absolute; inset: -5px; border-radius: 16px; border: 2px solid rgba(255, 255, 255, 0.85); pointer-events: none; transition: opacity 0.2s; }
.rail.is-closing .glass-icon.is-selected::after { opacity: 0; }</style>
</head>
<body>
<div id="root"></div>
<script src="glassicons.js"></script>

<script>addEventListener('load', () => requestAnimationFrame(() => requestAnimationFrame(() => window.webkit?.messageHandlers?.locken?.postMessage('ready'))));</script>
</body>
</html>
