<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="orb.css">
<style>html, body, #root { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
#root { position: relative; -webkit-mask-image: radial-gradient(circle closest-side at 50% 50%, #000 62%, transparent 100%);
  mask-image: radial-gradient(circle closest-side at 50% 50%, #000 62%, transparent 100%); }</style>
</head>
<body>
<div id="root"></div>
<script src="orb.js"></script>

<script>addEventListener('load', () => requestAnimationFrame(() => requestAnimationFrame(() => window.webkit?.messageHandlers?.locken?.postMessage('ready'))));</script>
</body>
</html>
